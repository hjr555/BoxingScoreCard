name: Issue Tracker Commenter

on:
  push:
    branches:
      - main

permissions:
  issues: write

jobs:
  comment:
    runs-on: ubuntu-latest
    steps:
      - name: Post resolution comment on referenced issues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          python3 - << 'PY'
          import os, re, subprocess

          msg = os.environ.get("COMMIT_MSG", "")
          sha = os.environ.get("COMMIT_SHA", "")[:7]
          nums = re.findall(r"(?:Fixes|Closes|Resolves)\s+#(\d+)", msg, re.IGNORECASE)
          lines = [l for l in msg.splitlines() if not re.match(r"^(?:Fixes|Closes|Resolves)\s+#\d+", l.strip(), re.IGNORECASE)]
          summary = "\n".join(lines).strip()
          body = f"Resolved in commit {sha}:\n\n{summary}"
          for n in nums:
              subprocess.run([
                  "gh", "issue", "comment", n,
                  "--repo", "hjr555/BoxingScoreCard",
                  "--body", body
              ], check=False)
          PY
