name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build and publish (e.g. v0.1.3)"
        required: true
        default: "v0.1.3"

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.artifact_name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: boxing-linux-x86_64
            bin_name: boxing
            archive_ext: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: boxing-windows-x86_64
            bin_name: boxing.exe
            archive_ext: zip
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: boxing-macos-arm64
            bin_name: boxing
            archive_ext: tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: boxing-macos-x86_64
            bin_name: boxing
            archive_ext: tar.gz

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Run test suite
        if: matrix.os == 'ubuntu-latest'
        run: cargo test --locked

      - name: Build release binary
        run: cargo build --release --locked --bin boxing --target ${{ matrix.target }}

      - name: Package archive (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p dist/${{ matrix.artifact_name }}
          cp target/${{ matrix.target }}/release/${{ matrix.bin_name }} dist/${{ matrix.artifact_name }}/
          cp README.md dist/${{ matrix.artifact_name }}/
          tar -C dist -czf ${{ matrix.artifact_name }}.tar.gz ${{ matrix.artifact_name }}
          cp target/${{ matrix.target }}/release/${{ matrix.bin_name }} ${{ matrix.artifact_name }}

      - name: Package archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "dist/${{ matrix.artifact_name }}"
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.bin_name }}" "dist/${{ matrix.artifact_name }}/"
          Copy-Item "README.md" "dist/${{ matrix.artifact_name }}/"
          Compress-Archive -Path "dist/${{ matrix.artifact_name }}" -DestinationPath "${{ matrix.artifact_name }}.zip"
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.bin_name }}" "${{ matrix.artifact_name }}.exe"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            ${{ matrix.artifact_name }}.*
            ${{ matrix.artifact_name }}

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate release notes from commits and issues
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          python3 - << 'PY'
          import os, re, subprocess

          tag = os.environ["RELEASE_TAG"]
          try:
              prev_tag = subprocess.check_output(
                  ["git", "describe", "--tags", "--abbrev=0", f"{tag}^"],
                  stderr=subprocess.DEVNULL,
              ).decode().strip()
              rev_range = f"{prev_tag}..{tag}"
          except subprocess.CalledProcessError:
              prev_tag = None
              rev_range = tag

          log_out = subprocess.check_output([
              "git", "log", rev_range, "--no-merges", "--pretty=format:%H%x1f%s%x1f%b%x1e"
          ]).decode()

          items = []
          for entry in reversed([e.strip() for e in log_out.split("\x1e") if e.strip()]):
              parts = (entry.split("\x1f") + ["", ""])[:3]
              sha, subject, body = parts[0], parts[1].strip(), parts[2].strip()
              short_sha = sha[:7]
              if re.match(r"^Release v\d+\.\d+\.\d+", subject):
                  continue
              issues = re.findall(r"(?:Fixes|Closes|Resolves)\s+(#\d+)", subject + "\n" + body, re.IGNORECASE)
              issue_ref = f" ({', '.join(issues)})" if issues else ""
              items.append(f"* {subject}{issue_ref} (`{short_sha}`)")

          lines = ["## What's Changed"]
          if items:
              lines.extend(items)
          else:
              lines.append(f"* Release {tag}")
          if prev_tag:
              lines.append("")
              lines.append(f"**Full Changelog**: https://github.com/hjr555/BoxingScoreCard/compare/{prev_tag}...{tag}")

          with open("RELEASE_NOTES.md", "w") as f:
              f.write("\n".join(lines) + "\n")
          PY

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate SHA256 checksums
        working-directory: artifacts
        run: sha256sum * > SHA256SUMS.txt

      - name: Create GitHub Release and upload binaries
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: Boxing Scorecard ${{ github.event.inputs.tag || github.ref_name }}
          body_path: RELEASE_NOTES.md
          files: artifacts/*
