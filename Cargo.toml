[workspace]
resolver = "2"
members = [
    "crates/boxing-core",
    "crates/boxing-tui",
]

[workspace.package]
version = "0.1.2"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.10", features = ["v4", "serde"] }
thiserror = "1.0"
ratatui = "0.28"
crossterm = "0.28"
